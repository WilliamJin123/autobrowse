# The worker, the deploy unit. `.env` supplies every secret (never baked in).
# Durable runs live in one SQLite file on the data volume (RUNNER_FILE); no server beside it.
services:
  worker:
    build: .
    env_file: .env
    environment:
      RUNNER_FILE: /data/runner.sqlite
      UI_PORT: "9080"
      UI_HOST: 0.0.0.0 # the host side of the port map stays loopback-only
      BROWSER: ${BROWSER:-local}
      BROWSER_CHANNEL: chromium # the image ships Playwright's build, no Google Chrome
    ports:
      - "127.0.0.1:${HOST_UI_PORT:-9080}:9080" # UI + API; put a token in UI_TOKEN before exposing wider
    volumes:
      - workerdata:/data
    # Chromium needs a bigger /dev/shm than Docker's default.
    shm_size: 1g
    restart: unless-stopped
volumes:
  workerdata:
